name: Bug report
description: 报告一个问题（抓不到回复、选择器失效、启动报错等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先看两件事，能省你不少时间：
        1. `ai-chat-cli sites` 确认站点配置正常；`ai-chat-cli chat mock "测试"` 能跑通说明工具本体没问题。
        2. 如果是某个站点抓不到回复，多半是网页改版了 —— 请附上 `python probe_send.py <站点>` 生成的 `test_report/<站点>_reply.html`。

        ⚠️ 提交前请把日志里的账号名、cookie、手机号等个人内容删掉。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望结果 vs 实际结果
      placeholder: |
        我执行了 `ai-chat-cli chat doubao "你好"`
        期望：终端打印豆包的回答
        实际：等了 300 秒，输出 (未捕获到回复)，退出码 3
    validations:
      required: true

  - type: dropdown
    id: site
    attributes:
      label: 涉及的站点
      multiple: true
      options:
        - 豆包 (doubao)
        - DeepSeek (deepseek)
        - 通义千问 (tongyi)
        - 腾讯元宝 (yuanbao)
        - Kimi (kimi)
        - mock / 与站点无关（CLI 本身的问题）
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 完整命令
      render: shell
      placeholder: ai-chat-cli batch all prompts.txt --delay 3
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 完整输出（stdout + stderr）
      description: 用 `ai-chat-cli -v ...` 可以拿到更详细的调试日志
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 输出 `ai-chat-cli --version`
      placeholder: ai-chat-cli 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "3.12.4"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我用的是**自己的**账号，做的是个人学习/研究用途
          required: true
        - label: 我已经把日志里的个人信息处理掉了
          required: true
        - label: 我已经搜索过现有 issue，没有重复
          required: true
