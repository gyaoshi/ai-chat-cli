name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      # CI 没有显示器：无界面 + 用 Playwright 自带 Chromium（不走 msedge）
      AI_CHAT_CLI_HEADLESS: "1"
      AI_CHAT_CLI_CHANNEL: "chromium"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium
      - name: Unit / CLI tests (no browser)
        run: pytest -m "not e2e" -q
      - name: End-to-end tests (local mock page)
        run: pytest -m e2e -q

  package:
    name: build & install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel and smoke-test the console script
        run: |
          python -m pip install dist/*.whl
          ai-chat-cli --version
          ai-chat-cli --help
      - name: Run from outside the repo (the pip-installed code path)
        working-directory: /tmp
        run: |
          # 这里必须能自己在用户目录生成 sites.json —— 验证"配置找不到"这个坑已解决
          ai-chat-cli sites
          test -f "$HOME/.config/ai-chat-cli/sites.json"
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
