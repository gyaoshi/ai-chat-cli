<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="ai-chat-cli 终端演示：向本地 mock 站点发一条消息并取回回复">
  <title>ai-chat-cli 终端演示</title>
  <desc>在终端执行 ai-chat-cli chat mock "帮我写一句关于春天的诗"，进度信息走 stderr、回复正文走 stdout。</desc>
  <style>
    .bg    { fill: #0d1117; }
    .bar   { fill: #161b22; }
    .dot1  { fill: #ff5f56; }
    .dot2  { fill: #ffbd2e; }
    .dot3  { fill: #27c93f; }
    .title { fill: #8b949e; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .txt   { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace; }
    .cmd   { fill: #e6edf3; }
    .log   { fill: #8b949e; }
    .reply { fill: #7ee787; }
    .hint  { fill: #58a6ff; font-size: 11px; }
    .line  { opacity: 0; animation-duration: 14s; animation-iteration-count: infinite;
             animation-timing-function: steps(1, end); }
    .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; }
    .l4 { animation-name: l4; } .l5 { animation-name: l5; } .l6 { animation-name: l6; }
    .l7 { animation-name: l7; } .l8 { animation-name: l8; }
    @keyframes l1 { 0%   { opacity: 0 }  4%,  100% { opacity: 1 } }
    @keyframes l2 { 0%   { opacity: 0 } 12%,  100% { opacity: 1 } }
    @keyframes l3 { 0%   { opacity: 0 } 20%,  100% { opacity: 1 } }
    @keyframes l4 { 0%   { opacity: 0 } 30%,  100% { opacity: 1 } }
    @keyframes l5 { 0%   { opacity: 0 } 44%,  100% { opacity: 1 } }
    @keyframes l6 { 0%   { opacity: 0 } 58%,  100% { opacity: 1 } }
    @keyframes l7 { 0%   { opacity: 0 } 72%,  100% { opacity: 1 } }
    @keyframes l8 { 0%   { opacity: 0 } 84%,  100% { opacity: 1 } }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .line { opacity: 1; animation: none; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="296" rx="10"/>
  <path class="bar" d="M0 10a10 10 0 0 1 10-10h740a10 10 0 0 1 10 10v22H0z"/>
  <circle class="dot1" cx="20" cy="16" r="6"/>
  <circle class="dot2" cx="40" cy="16" r="6"/>
  <circle class="dot3" cx="60" cy="16" r="6"/>
  <text class="title" x="380" y="21" text-anchor="middle">ai-chat-cli — mock 站点演示（不需要账号）</text>

  <text class="txt cmd l1" x="20" y="62">$ ai-chat-cli chat mock "帮我写一句关于春天的诗"</text>
  <text class="txt hint l2" x="20" y="88"># 下面几行走 stderr（进度），最后一行走 stdout（回复正文）</text>
  <text class="txt log l3" x="20" y="114">[Mock测试] 发送中...</text>
  <text class="txt log l4" x="20" y="140">[Mock测试] 回复（耗时 7 秒）:</text>
  <text class="txt reply l5" x="20" y="170">收到你的消息「帮我写一句关于春天的诗」。这是模拟AI的第1条回复，</text>
  <text class="txt reply l6" x="20" y="194">用于自动化测试验证发送与流式回复捕获是否正常工作，</text>
  <text class="txt reply l7" x="20" y="218">内容足够长以模拟真实的逐字输出效果。</text>

  <g class="l8">
    <text class="txt cmd" x="20" y="252">$ ai-chat-cli chat doubao "问题" &gt; answer.txt</text>
    <text class="txt hint" x="20" y="276">重定向拿到的就是干净文本，无需字符串清洗。</text>
  </g>
</svg>
